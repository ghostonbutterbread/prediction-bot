# Weather lane beta-shadow Prediction Lab collector.
# Shadow collector output lands in data/beta_shadow/paper/prediction_lab
# with the same JSONL schemas as normal Prediction Lab output, but under a
# separate root so default normal replay/analyze commands cannot mix data.
runtime:
  base_dir: data/beta_shadow
  isolated: true

storage:
  logs:
    enabled: true
    auto_prune: false
    include_paths:
      - data/beta_shadow/paper/paper_loop.log
      - data/beta_shadow/paper/prediction_lab/
      - data/beta_shadow/paper/archive/ops/
    exclude_paths:
      - data/paper/
      - data/live/
      - logs/

trading:
  # Collector is observer/no-real-trading. Do not use this as a live config.
  mode: paper
  enabled: false
  trading_enabled: false

strategy_policy:
  version: beta
  beta:
    mode: shadow
    features:
      weather_hidden_gem_evidence_card: true
      bucket_distribution_scoring: true
      hidden_gem_lane_gates: true
      lane_sizing_caps: true

strategy_lanes:
  # Beta-shadow only: compute lane gate/sizing deltas without changing final
  # paper/collector actions unless strategy_policy.beta.mode is promoted.
  enabled: true
  enabled_lanes:
    - edge
    - hidden_gem
    - confidence_slow_profit
  sizing:
    edge:
      max_position_usd: 5.0
      max_position_pct: 0.05
    hidden_gem:
      size_multiplier: 0.5
      max_position_usd: 3.0
      max_position_pct: 0.03
    confidence_slow_profit:
      size_multiplier: 0.5
      max_position_usd: 2.0
      max_position_pct: 0.02
  confidence_slow_profit:
    enabled: true
    min_edge: 0.02
    min_confidence: 0.75

prediction_lab:
  enabled: true
  paused: false
  mode: collector
  observer_mode: true
  groups:
    - weather
  max_markets_per_run: 1000
  max_new_predictions_per_seed: 500
  record_all_scored: true
  seed_daily_temp_first: true
  allow_non_weather: false
  # Default audit/replay window: newest two available monthly shards.
  replay_default_months: 2

  # Observer collection records replay-grade snapshots only by default.
  # Set score_only: false only for an intentional Prediction Lab prediction row run.
  score_only: true
  hypothetical_notional_mode: flat
  flat_notional_usd: 10
  use_sizing_logic: false
  use_shared_pipeline: true
  experiment_id: weather-beta-shadow
  strategy_version: beta-shadow
  min_confidence_to_record: 0.0
  min_edge_to_record: 0.0

  disable_news: true
  disable_social: true
  disable_ai: true

  continue_collecting: true
  collector_interval_seconds: 900
  shared_market_runtime_enabled: true
  shared_market_runtime_instance_id: collector-beta-shadow-weather
  collector_fetch_mode: direct_markets
  collector_direct_page_size: 200
  collector_max_pages: 10
  collector_record_market_snapshots: true
  collector_record_predictions: true

  collection_storage_cap_gb: 25
  collection_warning_threshold_pct: 90
  auto_pause_collection_on_storage_cap: true

  resolve_interval_seconds: 1800
  send_telegram_updates: false
  telegram_summary_on_pause: false

scan:
  allowed_market_groups:
    - weather
  allowed_market_routes:
    - weather.daily_temperature

strategy:
  enable_news: false
  enable_social: false
  enable_ai: false

shared_market:
  enabled: true
  runtime_root: data/beta_shadow/shared_market_runtime
  default_interval_seconds: 900
  min_interval_seconds: 300
  publisher_lease_timeout_seconds: 300
  consumer_timeout_seconds: 300
  snapshot_ttl_seconds: 1200
  stop_when_idle: true

