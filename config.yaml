openrouter:
  api_key_env: OPENROUTER_API_KEY
  model: minimax/minimax-m2.5
  fallback_model: google/gemini-2.5-flash
  max_tokens: 1024
  temperature: 0.3
  daily_call_budget: 20
  cache_ttl_minutes: 30
schedule:
  default_phases:
    quiet:
      max_hours_to_close: 999
      interval_seconds: 300
      researcher_enabled: false
    active:
      max_hours_to_close: 4
      interval_seconds: 120
      researcher_enabled: true
    hot:
      max_hours_to_close: 1
      interval_seconds: 30
      researcher_enabled: true
    live:
      max_hours_to_close: 0
      interval_seconds: 15
      researcher_enabled: false
  sports:
    quiet:
      max_hours_to_close: 48
      interval_seconds: 300
      researcher_enabled: false
    active:
      max_hours_to_close: 4
      interval_seconds: 120
      researcher_enabled: true
    hot:
      max_hours_to_close: 1
      interval_seconds: 30
      researcher_enabled: true
    live:
      max_hours_to_close: 0
      interval_seconds: 15
      researcher_enabled: false
  politics:
    quiet:
      max_hours_to_close: 168
      interval_seconds: 600
    active:
      max_hours_to_close: 24
      interval_seconds: 300
      researcher_enabled: true
    hot:
      max_hours_to_close: 2
      interval_seconds: 60
      researcher_enabled: true
market_types:
  sports:
    enabled: true
    max_hours_to_close: 48
    keywords:
    - nba
    - nfl
    - mlb
    - nhl
    - soccer
    - football
    - basketball
    - game
    - match
    - win
    - score
    - points
    - spread
    - player
    - injury
    - playoff
    - championship
    strategy_overrides:
      min_edge: 0.035
      min_confidence: 0.5
    researcher_prompts: sports
    schedule: sports
  politics:
    enabled: false
    max_hours_to_close: 720
    keywords:
    - election
    - president
    - congress
    - senate
    - vote
    - poll
    - approval
    - policy
    - legislation
    strategy_overrides:
      min_edge: 0.05
      min_confidence: 0.6
    researcher_prompts: politics
    schedule: politics
strategy:
  min_edge: 0.035
  min_confidence: 0.5
  news_weight: 0.15
  social_weight: 0.1
  ai_weight: 0.2
  enable_news: true
  enable_social: true
  enable_ai: true
  # Paper loop may override these safety knobs; keep shared config conservative
  # because `main.py live` can load config.yaml unless a live config is supplied.
  fail_closed_on_news_source_failure: false
  enable_weather_observation_log: false
  enable_weather_directional_mismatch_guard: false
  weather_observation_log_path: data/weather_observations.jsonl
  weather_observation_cooldown_seconds: 21600
kalshi_fee_rate: 0.07
kalshi:
  rate_limit:
    account_tier: shared-runtime-throttle
    reads_per_second: 1.0
    writes_per_second: 2.0
trading:
  mode: paper
  enabled: true
  send_startup: true
  send_shutdown: true
  send_pause_resume: true
alerts:
  enabled: true
  trade_events: true
  single_trade_events: true
  resolution_events: true
  reconciliation_events: false
  status_events: true
  scan_summaries: false
  telegram_enabled: true
  telegram_target: '-1003763915138'
  telegram_channel: telegram
  telegram_thread_id: '8'
  telegram_silent: false
verbosity:
  level: normal
max_tradable_balance: 0.0
max_position_size_usd: 0.0
risk:
  kelly_fraction_paper: 0.5
  max_bet_pct_paper: 0.1
  max_exposure_pct_paper: 0.4
  daily_loss_limit_pct_paper: 0.2
  max_drawdown_pct_paper: 0.5
  max_open_positions_paper: 15
  kelly_fraction_live: 0.25
  max_bet_pct_live: 0.05
  max_exposure_pct_live: 0.25
  daily_loss_limit_pct_live: 0.1
  max_drawdown_pct_live: 0.25
  max_open_positions_live: 10
  max_session_drawdown_pct: 0.2
  kelly_fraction: 0.5
  max_position_pct: 0.1
  daily_loss_limit_pct: 35
  max_drawdown_pct: 60
  max_open_positions: 15
parity_mode:
  enabled: false
  # production = live runtime keeps live risk preset
  # identical_risk = live runtime intentionally uses the paper risk preset for apples-to-apples comparison
  comparison_mode: production
strategy_lanes:
  # Disabled means lanes are recorded as decision metadata only; existing edge,
  # confidence, hidden-gem, risk, and execution gates keep their current behavior.
  enabled: false
  enabled_lanes:
    - edge
    - hidden_gem
  confidence_slow_profit:
    # Explicitly enable this plus strategy_lanes.enabled and beta/enforce
    # strategy_policy.beta.features.confidence_slow_profit to admit high-confidence,
    # lower-edge slow-profit trades with the thresholds below. When enabled,
    # normalization includes this lane in enabled_lanes.
    enabled: false
    min_edge:
    min_confidence:

paper_shadow_lanes:
  # Paper-only decision overlays. These do not mutate wallet balances,
  # accounting ledgers, shared candidates, or live orders.
  enabled: false
  definitions_dir: lanes
  enabled_lanes:
    - control_stable
    - shadow_confidence_floor
  shadow_confidence_floor:
    # Stable paper decision, but require confidence >= this floor before the
    # lane would buy. The stable/control wallet itself is unchanged.
    confidence_floor: 0.58
runtime:
  base_dir: data

scan:
  markets_per_exchange: 1000
  summary_sample_per_exchange: 25
  allowed_market_groups:
    - weather
    - sports

trade_economics:
  min_position_size_usd: 1.0
  min_expected_net_profit_usd: 0.10

prediction_lab:
  enabled: true
  paused: false
  mode: collector
  observer_mode: true
  groups:
    - weather
  max_markets_per_run: 1000
  continue_collecting: true
  collector_interval_seconds: 900
  resolve_interval_seconds: 1800
  collector_record_market_snapshots: true
  collector_record_predictions: true
  collector_fetch_mode: direct_markets
  collector_direct_page_size: 200
  collector_max_pages: 10
  collection_storage_cap_gb: 100
  collection_warning_threshold_pct: 90
  auto_pause_collection_on_storage_cap: true
  # Default audit/replay window: newest two available monthly shards.
  replay_default_months: 2
  # Production replay readiness targets market_snapshots.jsonl while score_only remains true.
  # Set score_only: false only when intentionally opening Prediction Lab prediction rows.
  score_only: true
  use_shared_pipeline: true
  experiment_id: weather-collector-v1
  strategy_version: v1
  hypothetical_notional_mode: flat
  flat_notional_usd: 10
  use_sizing_logic: false
  min_confidence_to_record: 0.0
  min_edge_to_record: 0.0
  record_all_scored: true
  seed_daily_temp_first: true
  disable_news: true
  disable_social: true
  disable_ai: true

logging:
  log_dir: data
  level: INFO
  save_snapshots: true
  snapshot_interval_scans: 5
storage:
  logs:
    enabled: true
    max_total_gb: 50
    warning_threshold_pct: 90
    hard_stop_threshold_pct: 105
    auto_prune: true
    prune_policy: oldest_first
    report_in_status: true
    include_paths:
    - data/paper_loop.log
    - data/paper_loop_runtime.log
    - data/watchdog.log
    - data/watchdog_cron.log
    - logs/
    - data/archive/ops/
    exclude_paths:
    - data/historical/
    - .venv/
