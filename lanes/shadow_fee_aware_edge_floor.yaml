id: shadow_fee_aware_edge_floor
type: fee_aware_edge_floor
source_wallet: stable_paper
source_role: baseline
input_source: shared_candidate_dataset
input_market_source: shared_market
enabled: false
description: >-
  Paper-only baseline selectivity comparator. It keeps an existing stable BUY
  only when the recorded decision-time edge remains above a fee-aware net-edge
  floor. It never creates a buy, changes sizing, or mutates accounting.
parameters:
  fee_rate: 0.07
  min_fee_aware_net_edge: 0.03
