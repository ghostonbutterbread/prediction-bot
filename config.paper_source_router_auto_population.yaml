# Disabled branch-local handoff for the strict auto-populated Source Router scorecard.
# Do not run directly. An owner must copy this to an ignored fresh-cohort config,
# replace the placeholder with one published manifest.runtime_consumption.scoreboard_path,
# and explicitly enable the paper shadow lane after the required review gate.
paper_shadow_lanes:
  enabled: false
  definitions_dir: lanes
  enabled_lanes: []
  source_scoreboard_path: ""
  shadow_source_router:
    enabled: false
    parameters:
      hypothetical_notional_usd: 10.0
      min_edge: 0.03
