# Weather lane beta-shadow paper runtime.
# Shadow data is intentionally rooted under data/beta_shadow so normal
# paper replay/analyze paths do not pick it up by default.
runtime:
  base_dir: data/beta_shadow
  isolated: true

storage:
  logs:
    enabled: true
    auto_prune: false
    include_paths:
      - data/beta_shadow/paper/paper_loop.log
      - data/beta_shadow/paper/prediction_lab/
      - data/beta_shadow/paper/archive/ops/
    exclude_paths:
      - data/paper/
      - data/live/
      - logs/

trading:
  # Paper loop remains paper/simulated only. Start it with SIMULATE_ONLY=true.
  mode: paper
  enabled: true

strategy_policy:
  version: beta
  beta:
    mode: shadow
    features:
      weather_hidden_gem_evidence_card: true
      bucket_distribution_scoring: true
      hidden_gem_lane_gates: true
      lane_sizing_caps: true

strategy_lanes:
  # Beta-shadow only: compute lane gate/sizing deltas without changing final
  # paper/collector actions unless strategy_policy.beta.mode is promoted.
  enabled: true
  enabled_lanes:
    - edge
    - hidden_gem
    - confidence_slow_profit
  sizing:
    edge:
      max_position_usd: 5.0
      max_position_pct: 0.05
    hidden_gem:
      size_multiplier: 0.5
      max_position_usd: 3.0
      max_position_pct: 0.03
    confidence_slow_profit:
      size_multiplier: 0.5
      max_position_usd: 2.0
      max_position_pct: 0.02
  confidence_slow_profit:
    enabled: true
    min_edge: 0.02
    min_confidence: 0.75

scan:
  allowed_market_groups:
    - weather
  allowed_market_routes:
    - weather.daily_temperature

strategy:
  enable_news: false
  enable_social: false
  enable_ai: false

